<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 487" role="img" aria-labelledby="title desc"><title id="title">Part II storyboard</title><desc id="desc">Six panels from an electricity bill to a question for campus facilities.</desc><rect width="690" height="487" rx="16" fill="#f4f3ef"/><g font-family="system-ui, sans-serif" fill="#203040"><text x="23" y="39" font-size="26" font-weight="750" fill="#203040">The Two Lives of an Intelligent Building</text><text x="23" y="64" font-size="17" font-weight="500" fill="#405564">Part II storyboard</text><g transform="translate(22 84)"><rect width="319" height="119" rx="10" fill="white"/><text x="13" y="23" font-size="11.5" font-weight="750" fill="#08716f">01 · START WITH A BILL</text><text x="13" y="50" font-size="18" font-weight="750" fill="#203040">What does a heater cost?</text><text x="13" y="76" font-size="13.5" font-weight="500" fill="#203040">1,000 watts for one hour</text><text x="13" y="96" font-size="13.5" font-weight="500" fill="#203040">15¢ at the example rate</text></g><g transform="translate(348 84)"><rect width="319" height="119" rx="10" fill="white"/><text x="13" y="23" font-size="11.5" font-weight="750" fill="#08716f">02 · INTRODUCE EFFICIENCY</text><text x="13" y="50" font-size="18" font-weight="750" fill="#203040">Same job, less energy</text><text x="13" y="76" font-size="13.5" font-weight="500" fill="#203040">A light timer is one example</text><text x="13" y="96" font-size="13.5" font-weight="500" fill="#203040">Some equipment needs to stay on</text></g><g transform="translate(22 214)"><rect width="319" height="119" rx="10" fill="white"/><text x="13" y="23" font-size="11.5" font-weight="750" fill="#08716f">03 · SHOW THE SURPRISE</text><text x="13" y="50" font-size="18" font-weight="750" fill="#203040">The meter barely drops</text><text x="13" y="76" font-size="13.5" font-weight="500" fill="#203040">Original sketch followed by two bars</text><text x="13" y="96" font-size="13.5" font-weight="500" fill="#203040">9.26 kW during vs. 8.71 kW outside</text></g><g transform="translate(348 214)"><rect width="319" height="119" rx="10" fill="white"/><text x="13" y="23" font-size="11.5" font-weight="750" fill="#08716f">04 · TRANSLATE INTO DOLLARS</text><text x="13" y="50" font-size="18" font-weight="750" fill="#203040">What might one hour cost?</text><text x="13" y="76" font-size="13.5" font-weight="500" fill="#203040">About $1.39 vs. $1.31</text><text x="13" y="96" font-size="13.5" font-weight="500" fill="#203040">Use the same example electricity rate</text></g><g transform="translate(22 344)"><rect width="319" height="119" rx="10" fill="white"/><text x="13" y="23" font-size="11.5" font-weight="750" fill="#08716f">05 · EXPLAIN PAYBACK</text><text x="13" y="50" font-size="18" font-weight="750" fill="#203040">When do savings cover cost?</text><text x="13" y="76" font-size="13.5" font-weight="500" fill="#203040">$1,500 ÷ $375 per year</text><text x="13" y="96" font-size="13.5" font-weight="500" fill="#203040">Four years in the example</text></g><g transform="translate(348 344)"><rect width="319" height="119" rx="10" fill="white"/><text x="13" y="23" font-size="11.5" font-weight="750" fill="#08716f">06 · CLOSE WITH A QUESTION</text><text x="13" y="50" font-size="18" font-weight="750" fill="#203040">Ask campus facilities</text><text x="13" y="76" font-size="13.5" font-weight="500" fill="#203040">What equipment is on this meter?</text><text x="13" y="96" font-size="13.5" font-weight="500" fill="#203040">Which loads need to stay on?</text></g></g></svg>