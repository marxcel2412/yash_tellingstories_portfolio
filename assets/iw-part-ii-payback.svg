<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 244" role="img" aria-labelledby="title desc"><title id="title">An example of simple payback</title><desc id="desc">Divide a 1500 dollar upgrade cost by 375 dollars in annual savings to get four years.</desc><rect width="660" height="244" rx="16" fill="#f4f3ef"/><g font-family="system-ui, sans-serif" fill="#203040"><text x="28" y="40" font-size="26" font-weight="750" fill="#203040">How long until savings cover the cost?</text><text x="28" y="68" font-size="17" font-weight="650" fill="#405564">Illustrative upgrade example</text><rect x="28" y="91" width="177" height="99" rx="10" fill="white"/><text x="44" y="135" font-size="28" font-weight="750" fill="#203040">$1,500</text><text x="44" y="165" font-size="16" font-weight="650" fill="#203040">Upfront cost</text><rect x="241" y="91" width="177" height="99" rx="10" fill="white"/><text x="257" y="135" font-size="28" font-weight="750" fill="#203040">$375</text><text x="257" y="165" font-size="16" font-weight="650" fill="#203040">Saved per year</text><rect x="454" y="91" width="177" height="99" rx="10" fill="#deefec"/><text x="470" y="135" font-size="28" font-weight="750" fill="#203040">4 years</text><text x="470" y="165" font-size="16" font-weight="650" fill="#203040">Simple payback</text><text x="213" y="148" font-size="20" font-weight="700" fill="#203040">÷</text><text x="425" y="148" font-size="20" font-weight="700" fill="#203040">=</text><text x="28" y="221" font-size="15" font-weight="500" fill="#405564">Assumes electricity at 15¢ per kWh and 2,500 kWh saved per year.</text></g></svg>