<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 267" role="img" aria-labelledby="title desc"><title id="title">Electricity draw barely dropped</title><desc id="desc">Zero-based bars show 9.26 kilowatts during weekday work hours and 8.71 outside them.</desc><rect width="660" height="267" rx="16" fill="#f4f3ef"/><g font-family="system-ui, sans-serif" fill="#203040"><text x="28" y="40" font-size="27" font-weight="750" fill="#203040">Electricity draw barely dropped</text><text x="28" y="70" font-size="17" font-weight="500" fill="#203040">Typical weekday power draw at the Intelligent Workplace</text><text x="28" y="105" font-size="17" font-weight="650" fill="#203040">During assumed work hours</text><rect x="28" y="115" width="500.03999999999996" height="26" rx="4" fill="#23536a"/><text x="540.04" y="135" font-size="19" font-weight="700" fill="#203040">9.26 kW</text><text x="28" y="174" font-size="17" font-weight="650" fill="#203040">Outside assumed work hours</text><rect x="28" y="184" width="470.34000000000003" height="26" rx="4" fill="#08716f"/><text x="510.34000000000003" y="204" font-size="19" font-weight="700" fill="#203040">8.71 kW</text><text x="28" y="239" font-size="16" font-weight="500" fill="#405564">Bars start at zero. Outside-hours draw was about 6% lower.</text></g></svg>