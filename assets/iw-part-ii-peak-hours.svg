<svg xmlns="http://www.w3.org/2000/svg" width="720" height="379" viewBox="0 0 720 379" role="img" aria-labelledby="title desc"><title id="title">How often did demand hit the top 5%?</title><desc id="desc">Of hours in each period, 87 of 1,134 outside weekday work hours, 48 of 810 during weekday work hours, and 2 of 791 on weekends.</desc><rect width="720" height="379" rx="14" fill="#f4f6f3"/><g font-family="system-ui, sans-serif"><text x="28" y="44" fill="#203040" font-size="29" font-weight="750">How often did demand hit the top 5%?</text><text x="28" y="76" fill="#405564" font-size="19" font-weight="550">Share of valid hours in each period</text><text x="28" y="116" fill="#203040" font-size="21" font-weight="680">Weekdays outside work hours</text><rect x="28" y="129" width="452.64550264550263" height="20" rx="3" fill="#08716f"/><text x="494.64550264550263" y="146" fill="#203040" font-size="19" font-weight="750">7.7%</text><text x="529" y="146" fill="#405564" font-size="17" font-weight="550">87 of 1,134</text><text x="28" y="190" fill="#203040" font-size="21" font-weight="680">Weekdays during work hours</text><rect x="28" y="203" width="349.6296296296296" height="20" rx="3" fill="#78949a"/><text x="391.6296296296296" y="220" fill="#203040" font-size="19" font-weight="750">5.9%</text><text x="529" y="220" fill="#405564" font-size="17" font-weight="550">48 of 810</text><text x="28" y="264" fill="#203040" font-size="21" font-weight="680">Weekends</text><rect x="28" y="277" width="14.917825537294561" height="20" rx="3" fill="#78949a"/><text x="56.91782553729456" y="294" fill="#203040" font-size="19" font-weight="750">0.3%</text><text x="529" y="294" fill="#405564" font-size="17" font-weight="550">2 of 791</text><text x="28" y="347" fill="#405564" font-size="17" font-weight="500">Assumed weekday work hours: 8 a.m. to 6 p.m.</text></g></svg>
