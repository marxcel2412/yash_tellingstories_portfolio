<svg xmlns="http://www.w3.org/2000/svg" width="720" height="285" viewBox="0 0 720 285" role="img" aria-labelledby="title desc"><title id="title">A bright room can use less electric light</title><desc id="desc">An illustration of the same room with less and more daylight. A daylight-responsive control can dim the electric lights as daylight increases.</desc><rect width="720" height="285" rx="14" fill="#f4f6f3"/><g font-family="system-ui, sans-serif"><text x="28" y="42" fill="#203040" font-size="29" font-weight="740">A bright room can use less electric light</text><text x="28" y="72" fill="#405564" font-size="19" font-weight="550">How daylight-responsive lighting works</text><g transform="translate(28 94)"><rect width="324" height="139" rx="10" fill="#fff"/><rect x="23" y="20" width="61" height="68" rx="4" fill="#dceaf1"/><path d="M53.5 20v68M23 54h61" stroke="#526e7b" stroke-width="2"/><path d="M175 21v15m-24 16 10-16h28l10 16z" fill="#f9d889" stroke="#526e7b" stroke-width="2"/><path d="M156 62l-7 8m26-5v10m19-13 7 8" stroke="#a46d19" stroke-width="3" stroke-linecap="round"/><text x="23" y="112" fill="#203040" font-size="20" font-weight="750">Less daylight</text><text x="23" y="133" fill="#405564" font-size="15" font-weight="500">Electric lights supply more light</text></g><g transform="translate(368 94)"><rect width="324" height="139" rx="10" fill="#fff"/><rect x="23" y="20" width="61" height="68" rx="4" fill="#f9d889"/><path d="M53.5 20v68M23 54h61" stroke="#526e7b" stroke-width="2"/><path d="M90 29l21-10m-21 27h24m-24 17l21 10" stroke="#a46d19" stroke-width="3" stroke-linecap="round"/><path d="M175 21v15m-24 16 10-16h28l10 16z" fill="#e8eeec" stroke="#526e7b" stroke-width="2"/><text x="23" y="112" fill="#203040" font-size="20" font-weight="750">More daylight</text><text x="23" y="133" fill="#405564" font-size="15" font-weight="500">Electric lights can dim</text></g><text x="28" y="266" fill="#405564" font-size="16" font-weight="500">Concept illustration. CMU researchers tested daylighting strategies at the IW.</text></g></svg>
